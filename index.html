<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <meta name="description" content="Aussieblock Ready Mix — order concrete, track your truck live, and pay invoices online." />
    <!-- Link preview when the app URL is texted or emailed (iMessage, WhatsApp,
         Messages, Gmail, Facebook…). og:image must be an ABSOLUTE URL; %PUBLIC_URL%
         is filled in at build time from VITE_PUBLIC_URL (see vite.config.js). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aussieblock Ready Mix" />
    <meta property="og:title" content="Aussieblock Ready Mix — Customer App" />
    <meta property="og:description" content="Order concrete, track your truck live, and pay invoices online." />
    <meta property="og:url" content="%PUBLIC_URL%/" />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />
    <meta property="og:image:secure_url" content="%PUBLIC_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Aussieblock Ready Mix kangaroo logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aussieblock Ready Mix — Customer App" />
    <meta name="twitter:description" content="Order concrete, track your truck live, and pay invoices online." />
    <meta name="twitter:image" content="%PUBLIC_URL%/og-image.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Aussieblock</title>
    <!-- Installable app (PWA): lets staff install the dispatch board so the
         new-order alarm can sound without a click after launch. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0c1117" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aussieblock" />
    <!-- Tailwind CSS via Play CDN. Fine for a prototype: it makes all the
         utility classes (flex, rounded-2xl, padding, etc.) work with no build
         step. For production, swap this for a compiled Tailwind setup. -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
